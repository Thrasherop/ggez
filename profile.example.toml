# Example ggez profile. Apply with:  ggez apply profile.example.toml
# Every key is optional; leave out what you do not want changed.

dpi = [400, 800, 1400, 2400, 3200]   # 1 to 5 presets, 100-18000
dpi_select = 3                       # active preset, counting from 1
polling = 1000                       # Hz: 125, 250, 500 or 1000
sleep_minutes = 5                    # 0-20, 0 = never
dim_seconds = 30                     # 0-1200, 0 = never
brightness = 100                     # percent; the mouse has 16 steps
smart_lighting = false               # lights off while the mouse moves
battery_saver = false                # lights off, 125 Hz, power-saving mode

# Lighting the mouse shows by itself after power-on:
# off, reactive, rainbow or reactive-rainbow.
default_lighting = "rainbow"
reactive = "off"                     # color flashed on click, or "off"

# What the LEDs show while a computer is driving them: "static" uses the
# zone colors below, "rainbow" the mouse's built-in color cycle.
effect = "static"

# Zone colors are NOT stored on the mouse: they last until it powers off.
# The ggez helper re-sends them whenever the mouse connects or wakes.
[colors]
top = "#ff0000"       # front
middle = "#00ff00"    # under the palm
bottom = "#0000ff"    # by the wrist

# Bindings are stored on the mouse and work without any software running.
# Buttons not listed here get their factory binding.
# Buttons: left, right, middle, tilt-left, tilt-right, dpi, g1-g12,
#          scroll-up, scroll-down
# Actions: disabled, left, right, middle, back, forward, dpi, scroll-up,
#          scroll-down, key:<key>[+<key>...], media:<name>
# "primary" is Ctrl on Windows and Linux and Cmd on a Mac, as in
# "key:primary+c". The helper sets it each time the mouse arrives, so a
# binding that uses it needs ggez running on each computer.
[buttons]
g10 = "key:ctrl+x"
g11 = "key:ctrl+c"
g12 = "key:ctrl+v"

# A macro is a button that runs a list of steps on the computer. Macros
# need the ggez helper running, and run on Windows only so far. Up to
# twelve buttons can have one, and a button has either a macro or a binding
# under [buttons], not both.
# Steps: key:<key>[+<key>...], down:<key>, up:<key>, text:<what to type>,
#        click:<left|right|middle|back|forward>, wait:<milliseconds>
# mode:  "once" for each press (the default), "repeat" while the button is
#        held, or "toggle" from one press until the next.
[macros.g9]
steps = ["key:ctrl+c", "wait:80", "key:alt+tab", "wait:200", "key:ctrl+v"]
