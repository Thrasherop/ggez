[package]
name = "ggez-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Protocol and device layer for SteelSeries Aerox 9 Wireless mice"

[features]
default = ["hid"]
# Real hardware access. Disable to build the pure protocol layer only.
hid = ["dep:hidapi"]

[dependencies]
thiserror = "2"
# On a Mac hidapi takes a device for itself alone unless told otherwise,
# which would shut out the helper while the window is open, and the reverse.
hidapi = { version = "2", optional = true, features = ["macos-shared-device"] }
