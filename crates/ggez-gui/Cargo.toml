[package]
name = "ggez-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Graphical app for configuring SteelSeries Aerox 9 Wireless mice"

[dependencies]
ggez-core = { path = "../ggez-core" }
ggez-service = { path = "../ggez-service" }
anyhow = "1"
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[dev-dependencies]
egui_kittest = "0.31"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Writes the program icon as a PNG for packaging. Listed so that its tests
# run with the rest.
[[example]]
name = "icon_png"
test = true
