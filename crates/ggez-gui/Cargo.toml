[package]
name = "ggez-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Graphical app for configuring SteelSeries Aerox 9 Wireless mice"

[dependencies]
ggez-core = { path = "../ggez-core" }
ggez-service = { path = "../ggez-service" }
anyhow = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
