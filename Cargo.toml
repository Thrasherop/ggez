[workspace]
resolver = "2"
members = ["crates/ggez-core", "crates/ggez-service", "crates/ggez-cli", "crates/ggez-gui"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Thrasherop/ggez"

[profile.release]
# Smaller programs to download; no debugging symbols.
strip = true
lto = "thin"
